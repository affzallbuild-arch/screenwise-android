name: Build ScreenWise Android
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Generate official Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2
      - name: Compile and run local unit tests
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: screenwise-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Optional signed release build (manual runs with configured secrets)
        if: github.event_name == 'workflow_dispatch'
        env:
          SCREENWISE_KEYSTORE_BASE64: ${{ secrets.SCREENWISE_KEYSTORE_BASE64 }}
          SCREENWISE_STORE_PASSWORD: ${{ secrets.SCREENWISE_STORE_PASSWORD }}
          SCREENWISE_KEY_ALIAS: ${{ secrets.SCREENWISE_KEY_ALIAS }}
          SCREENWISE_KEY_PASSWORD: ${{ secrets.SCREENWISE_KEY_PASSWORD }}
        run: |
          if [ -z "$SCREENWISE_KEYSTORE_BASE64" ] || [ -z "$SCREENWISE_STORE_PASSWORD" ] || [ -z "$SCREENWISE_KEY_ALIAS" ] || [ -z "$SCREENWISE_KEY_PASSWORD" ]; then
            echo 'Signing secrets missing. Skipping release build.'
            exit 0
          fi
          export SCREENWISE_KEYSTORE_PATH="$RUNNER_TEMP/screenwise-release.jks"
          printf '%s' "$SCREENWISE_KEYSTORE_BASE64" | base64 --decode > "$SCREENWISE_KEYSTORE_PATH"
          chmod 600 "$SCREENWISE_KEYSTORE_PATH"
          ./gradlew --no-daemon assembleRelease
      - name: Upload signed release APK if produced
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: screenwise-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
